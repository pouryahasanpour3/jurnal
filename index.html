<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ژورنال ترید</title>
<meta name="description" content="ژورنال معاملات کریپتو">
<meta name="theme-color" content="#0b0e14" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ژورنال ترید">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<script>
/* Pre-paint: apply language, theme, accent and lock state before first render (no flash). */
try{var _s=JSON.parse(localStorage.getItem('tj-state-v1')||'null'),_o=(_s&&_s.settings)||{},_h=document.documentElement;
if(_o.lang==='en'){_h.lang='en';_h.dir='ltr'}
if(_o.theme==='light')_h.classList.add('light');
if(_o.theme==='ocean')_h.classList.add('ocean');
else if(_o.accent&&_o.accent!=='amber')_h.classList.add('acc-'+_o.accent);
if(localStorage.getItem('tj-lock'))_h.classList.add('lkd');
document.getElementById('tc').content=_o.theme==='light'?'#f4f6fa':_o.theme==='ocean'?'#0b1026':'#0b0e14';}catch(e){}
</script>
<style>
:root{
  --bg:#0b0e14;--surface:#121722;--surface2:#1a2130;--surface3:#222b3c;--border:#262f40;
  --text:#e7ebf3;--muted:#949eb0;--faint:#838da0;
  --pos:#22c55e;--pos-bg:rgba(34,197,94,.13);--neg:#f2555a;--neg-bg:rgba(242,85,90,.13);
  --acc:#f5a524;--acc-ink:#f5a524;--on-acc:#14110a;--acc-bg:rgba(245,165,36,.14);
  --warn:#f5a524;--shadow:0 1px 2px rgba(0,0,0,.35);
  --hl:var(--acc);--sec:var(--muted);--sec-bg:var(--surface2);--seg-on:var(--surface);--seg-on-ink:var(--text);--sel:var(--text);--heat-pos:var(--pos);--heat-neg:var(--neg);
  --r:14px;--r-sm:10px;--gap:16px;
  --f-fa:Vazirmatn,Tahoma,"Segoe UI",sans-serif;--f-en:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
  --tab-h:64px;--side-w:248px;
  color-scheme:dark;
}
html.light{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#eef1f6;--surface3:#e3e8f0;--border:#dce2eb;
  --text:#0f172a;--muted:#556074;--faint:#5f6a7e;
  --pos:#137333;--pos-bg:rgba(19,115,51,.10);--neg:#c62020;--neg-bg:rgba(198,32,32,.09);--seg-on:#ffffff;
  --acc:#f59e0b;--acc-ink:#a15c07;--on-acc:#14110a;--acc-bg:rgba(245,158,11,.14);
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 1px rgba(15,23,42,.04);
  color-scheme:light;
}
/* Ocean theme (v1.1): deep blue-indigo surfaces, gray text, Tiffany primary, purple secondary, sparing yellow highlights.
   PnL green/red tuned for AA on every surface and kept distinct from the Tiffany primary. */
html.ocean{
  --bg:#0b1026;--surface:#121a36;--surface2:#19234a;--surface3:#222e5c;--border:#2c3a6b;
  --text:#e8edf7;--muted:#a6b0c6;--faint:#8e98b2;
  --pos:#4ade80;--pos-bg:rgba(74,222,128,.13);--neg:#ff7a8a;--neg-bg:rgba(255,122,138,.13);
  --acc:#0abab5;--acc-ink:#2ed3cd;--on-acc:#04201f;--acc-bg:rgba(10,186,181,.15);
  --sec:#a99bff;--sec-bg:rgba(139,124,246,.18);--hl:#f7c948;--warn:#f7c948;
  --seg-on:rgba(139,124,246,.24);--seg-on-ink:#ffffff;--sel:#a99bff;--heat-neg:#ff3b5c;
  --shadow:0 1px 2px rgba(3,6,20,.45);
  color-scheme:dark;
}
html.acc-blue{--acc:#4c8dff;--acc-ink:#6ea2ff;--on-acc:#06122a;--acc-bg:rgba(76,141,255,.15)}
html.light.acc-blue{--acc:#2563eb;--acc-ink:#1d4ed8;--on-acc:#ffffff;--acc-bg:rgba(37,99,235,.10)}
html.acc-teal{--acc:#2dd4bf;--acc-ink:#2dd4bf;--on-acc:#04201c;--acc-bg:rgba(45,212,191,.14)}
html.light.acc-teal{--acc:#0f766e;--acc-ink:#0f766e;--on-acc:#ffffff;--acc-bg:rgba(15,118,110,.10)}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:var(--f-fa);font-size:15px;line-height:1.55;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-family:var(--f-en)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--acc-ink)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num,bdi.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.skip{position:fixed;top:8px;inset-inline-start:8px;z-index:200;padding:10px 14px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-weight:700;text-decoration:none;transform:translateY(-200%)}
.skip:focus{transform:none}
.req{color:var(--neg);margin-inline-start:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
html.lkd #app{visibility:hidden}

/* ---------- App shell (mobile first) ---------- */
#app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.brand-sm{display:flex;align-items:center;gap:8px}
.brand-sm img{width:30px;height:30px;border-radius:8px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:12px;color:var(--text);background:var(--surface);border:1px solid var(--border);transition:background .18s,border-color .18s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn[aria-current=page]{color:var(--acc-ink);border-color:var(--acc)}
.top .add-d{display:none}
main{padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border)}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);transition:color .18s}
.tab{position:relative}
.tab[aria-current=page]{color:var(--acc-ink)}
.tab[aria-current=page]:before{content:"";position:absolute;top:4px;left:50%;width:20px;height:3px;margin-left:-10px;border-radius:3px;background:var(--hl)}
.tab-add{justify-self:center;width:52px;height:52px;border-radius:16px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
.tab-add:active{transform:scale(.95)}
.tab-add svg.i{width:26px;height:26px;stroke-width:2.4}

/* ---------- Cards & primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:var(--gap)}
.card h2,.h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:block;margin-bottom:4px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.kpi .s{font-size:12px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .bal{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hero .lbl{font-size:13px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}.pill.neg{background:var(--neg-bg);color:var(--neg)}
.pill.acc{background:var(--acc-bg);color:var(--acc-ink)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:38px;padding:0 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:background .18s,color .18s}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--seg-on-ink);box-shadow:var(--shadow)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg button.long[aria-pressed=true]{background:var(--pos-bg);color:var(--pos)}
.seg button.short[aria-pressed=true]{background:var(--neg-bg);color:var(--neg)}
.btn{min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:background .18s,filter .18s;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .ill{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:var(--acc-bg);color:var(--acc-ink);display:grid;place-items:center}
.empty .ill svg.i{width:30px;height:30px}
.empty h3{color:var(--text);margin:0 0 6px;font-size:17px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ---------- Chart ---------- */
.chart{position:relative;height:220px;direction:ltr;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;border-radius:8px}
.chart svg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chart .tip{position:absolute;top:6px;pointer-events:none;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translateX(-50%)}
.chart .tip b{display:block;font-size:13.5px}
.chart .tip.on{opacity:1}
.axis{font-size:11px;fill:var(--muted);font-family:var(--f-en)}
html[lang=fa] .axis{font-family:var(--f-fa)}

/* ---------- Trades list ---------- */
.tools{display:flex;gap:10px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding-inline:40px 12px}
.search svg.i{position:absolute;inset-inline-start:12px;top:12px;color:var(--muted)}
.filters{display:none;margin-top:12px}
.filters.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.sumbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.day-h{font-size:12.5px;color:var(--muted);font-weight:600;margin:18px 4px 8px}
.trade{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:border-color .18s,background .18s;width:100%;text-align:start}
.trade+.trade{margin-top:8px}
.trade:hover{border-color:var(--surface3);background:var(--surface2)}
.trade .side-dot{width:6px;align-self:stretch;border-radius:4px;background:var(--pos);flex:none}
.trade .side-dot.short{background:var(--neg)}
.trade .mid{flex:1;min-width:0}
.trade .sym{font-weight:700;font-size:15px;font-family:var(--f-en);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trade .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade .end{text-align:end;flex:none}
.trade .pnl{font-weight:700;font-size:15px;display:block}
.trade .sub{font-size:12px;color:var(--muted)}
.trade .del{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.trade .del:hover{background:var(--neg-bg);color:var(--neg)}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);font-family:var(--f-en)}
.tag.sec{background:var(--sec-bg);color:var(--sec)}
.tag.long{background:var(--pos-bg);color:var(--pos)}.tag.short{background:var(--neg-bg);color:var(--neg)}
html[lang=fa] .tag{font-family:var(--f-fa)}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-head .t{font-weight:700;font-size:16px;text-align:center;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11.5px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;min-height:44px;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;border:1px solid transparent;position:relative;padding:2px;overflow:hidden}
.cal .d .dn{font-weight:600;color:var(--muted);font-size:12px}
.cal .d .dp{font-size:10.5px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.has{cursor:pointer}
.cal .d.today{border-color:var(--hl);border-width:2px}
.cal .d.sel{outline:2px solid var(--sel);outline-offset:1px}
.cal .d.x{background:transparent}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ---------- Stats bars ---------- */
.srow{display:grid;grid-template-columns:minmax(96px,1.3fr) minmax(60px,1.6fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:0}
.srow .nm{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px;white-space:normal;line-height:1.4}
.bar{height:10px;background:var(--surface2);border-radius:6px;position:relative;overflow:hidden;direction:ltr}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px}
.bar i.p{left:50%;background:var(--pos)}.bar i.n{right:50%;background:var(--neg)}
.bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border)}
.srow .vv{text-align:end;font-weight:700;font-size:13.5px;min-width:76px}
.srow .vv small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row .l{font-weight:600}
.set-row .l small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.chip[aria-pressed=true]{background:var(--acc-bg);border-color:var(--acc);color:var(--text)}
.chip .x{width:24px;height:24px;margin-inline-end:-8px;display:grid;place-items:center;border-radius:50%}
.chip .x:hover{background:var(--neg-bg);color:var(--neg)}
.chip .x svg.i{width:14px;height:14px}
.swatch{width:44px;height:44px;border-radius:12px;border:2px solid transparent;display:grid;place-items:center}
.swatch[aria-pressed=true]{border-color:var(--text)}
.swatch i{width:24px;height:24px;border-radius:50%;display:block}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;margin-top:10px}
.tcard{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);text-align:start;min-height:44px;transition:border-color .15s}
.tcard:hover{border-color:var(--muted)}
.tcard[aria-pressed=true]{border-color:var(--acc)}
.tcard .pv{height:62px;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(127,127,127,.25)}
.tcard .pv i{display:block;border-radius:4px;height:8px}
.tcard .pv .row{display:flex;gap:5px;align-items:center}
.tcard .pv .dot{width:12px;height:12px;border-radius:50%;flex:none}
.tcard .nm{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13.5px;font-weight:700;padding:0 2px}
.tcard .nm svg.i{width:16px;height:16px;color:var(--acc-ink);visibility:hidden}
.tcard[aria-pressed=true] .nm svg.i{visibility:visible}
.set-row.col{flex-direction:column;align-items:stretch}
.ver{text-align:center;color:var(--faint);font-size:12px;margin-top:16px}

/* ---------- Form sheet ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.62);display:none}
.ovl.on{display:block;animation:fade .18s ease}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex;animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--border)}
.sheet-h h2{flex:1;margin:0;font-size:18px}
.sheet-b{flex:1;overflow:auto;padding:16px;overscroll-behavior:contain}
.sheet-f{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
.sheet-f .sp{flex:1}
.fsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.fsec+.fsec{margin-top:14px}
.fsec>h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .w{grid-column:1/-1}
#f_sym{text-transform:uppercase}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:46px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);padding:0 12px;transition:border-color .15s}
.inp:focus{border-color:var(--acc);outline:none}
.inp.ltr{direction:ltr;text-align:left;font-family:var(--f-en)}
html[lang=fa] .inp.ltr::placeholder{font-family:var(--f-fa)}
textarea.inp{min-height:96px;padding:10px 12px;resize:vertical;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-size:5px 5px;background-repeat:no-repeat;background-position:left 14px center,left 9px center;padding-inline-end:30px}
html[dir=ltr] select.inp{background-position:right 9px center,right 14px center}
.inp-g{display:flex;gap:6px}.inp-g .inp{flex:1}
.err{color:var(--neg);font-size:12.5px;min-height:0}
.inp[aria-invalid=true]{border-color:var(--neg)}
.hint{font-size:12px;color:var(--faint)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sugg button{min-height:34px;padding:0 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:600;font-family:var(--f-en);color:var(--muted)}
.sugg button:hover{color:var(--text)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.calc div{background:var(--surface2);border-radius:10px;padding:10px;min-width:0}
.calc span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.calc b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.stars{display:flex;gap:4px}
.stars button{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--faint)}
.stars button.on{color:var(--hl)}
.stars button.on svg.i{fill:currentColor}
.stars svg.i{width:26px;height:26px}
.shots{display:flex;gap:10px;flex-wrap:wrap}
.shot{width:88px;height:88px;border-radius:10px;overflow:hidden;position:relative;background:var(--surface2);border:1px solid var(--border)}
.shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.shot .rm{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.shot .rm svg.i{width:16px;height:16px}
.shot-add{width:88px;height:88px;border-radius:10px;border:1.5px dashed var(--border);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.shot-add:hover{border-color:var(--acc);color:var(--acc-ink)}

/* ---------- Modal / toast / viewer / lock ---------- */
.modal{position:fixed;z-index:80;inset-inline:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal.on{display:block;animation:fade .16s ease}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 16px;color:var(--muted)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--surface3);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.viewer{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.viewer .icon-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:12px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#lock.on{display:flex}
html.lkd #lock{display:flex}
#lock img{width:64px;height:64px;border-radius:16px}
#lock .lt{font-weight:700;font-size:17px;text-align:center}
.dots{display:flex;gap:14px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;direction:ltr}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:24px;font-weight:600;font-family:var(--f-en)}
.pad button:active{background:var(--surface3)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- Tablet ---------- */
@media (min-width:640px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fg.fg2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 48px));height:min(860px,calc(100% - 48px));border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .sheet.on{animation:fade .18s ease}
  .filters.on{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- Desktop ≥1024: sidebar, single gear in top bar. CSS-only. ---------- */
@media (min-width:1024px){
  #app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main"}
  .side{grid-area:side;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--surface);border-inline-end:1px solid var(--border)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:16px}
  .side .brand img{width:36px;height:36px;border-radius:10px}
  .side .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .side .nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;color:var(--muted);font-weight:600;transition:background .15s,color .15s}
  .side .nav:hover{background:var(--surface2);color:var(--text)}
  .side .nav{position:relative}
  .side .nav[aria-current=page]{background:var(--acc-bg);color:var(--text)}
  .side .nav[aria-current=page]:before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--hl)}
  .side .nav[aria-current=page] svg.i{color:var(--acc-ink)}
  .side .btn{margin-top:14px}
  .side .foot{margin-top:auto;font-size:12px;color:var(--faint);padding:0 12px}
  .top{grid-area:top;padding:14px 32px;background:var(--bg)}
  .top .brand-sm{display:none}
  .top .add-d{display:inline-flex}
  main{grid-area:main;max-width:1280px;width:100%;margin:0;padding:24px 32px 48px}
  .tabs{display:none}
  .toast{bottom:28px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--gap);align-items:start}
  .dash>.stack{margin:0}
  .dash .full{grid-column:1/-1}
  .chart{height:300px}
  .stats-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}
  .stats-g>*+*{margin-top:0}
  .cal-g{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--gap);align-items:start}
  .cal-g>*+*{margin-top:0}
  .set-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:start}
  .set-g>*+*{margin-top:0}
  .cal .d{aspect-ratio:auto;min-height:64px}
  .cal .d .dp{font-size:11.5px}
  .filters.on{grid-template-columns:repeat(6,minmax(0,1fr))}
  .trades-l{max-width:none}
}
/* Touch devices: every control ≥44px tall (skill rule touch-target-size); desktop keeps compact controls. */
@media (pointer:coarse){
  .seg button,.btn.sm,.chip,.sugg button{min-height:44px}
  .check{min-width:44px;justify-content:center}
  .seg button{min-width:44px}
  .chip .x{position:relative}.chip .x:after{content:"";position:absolute;inset:-10px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('tj-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('shots');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('shots',mode),s=tx.objectStore('shots'),r=fn(s);tx.oncomplete=()=>res(r&&'result'in r?r.result:undefined);tx.onerror=()=>rej(tx.error)}));
  return{get:k=>run('readonly',s=>s.get(k)),put:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k)),clear:()=>run('readwrite',s=>s.clear()),
    all:()=>open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('shots','readonly'),s=tx.objectStore('shots'),k=s.getAllKeys(),v=s.getAll();tx.oncomplete=()=>{const o={};k.result.forEach((x,i)=>o[x]=v.result[i]);res(o)};tx.onerror=()=>rej(tx.error)}))}})();
function compressImage(file,max=1400,q=.78){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{let{width:w,height:h}=img;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.src=fr.result};fr.readAsDataURL(file)})}

/* ---------------- Formatting ---------------- */
const faDig=()=>st().lang==='fa'&&st().digits==='fa';
const numLoc=()=>faDig()?'fa-IR':'en-US';
const dateLoc=()=>st().lang==='fa'?(faDig()?'fa-IR-u-ca-persian':'fa-IR-u-ca-persian-nu-latn'):'en-US';
const _nf={};
function nf(n,min=2,max=min){const k=numLoc()+min+'-'+max;return(_nf[k]||(_nf[k]=new Intl.NumberFormat(numLoc(),{minimumFractionDigits:min,maximumFractionDigits:max}))).format(n)}
const dig=s=>faDig()?String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]):String(s);
const N=s=>`<bdi class="n">${s}</bdi>`;
function money(n,signed=true){if(n==null||!isFinite(n))return'—';const s=signed?(n>0?'+':n<0?'−':''):(n<0?'−':'');return N(s+nf(Math.abs(n),2))}
function price(n){if(n==null||!isFinite(n)||n===0)return'—';const a=Math.abs(n);return N(a>=1000?nf(n,2):a>=1?nf(n,2,4):nf(n,2,8))}
function pct(n,signed=true){if(n==null||!isFinite(n))return'—';const s=signed?(n>0?'+':n<0?'−':''):'';return N(s+nf(Math.abs(n),1,2)+'%')}
function rfmt(n){if(n==null||!isFinite(n))return'—';return N((n>0?'+':n<0?'−':'')+nf(Math.abs(n),2)+'R')}
const cls=n=>n>0?'pos':n<0?'neg':'mut';
const parseNum=v=>{if(v==null)return NaN;v=String(v).trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫]/g,'.').replace(/[,٬\s]/g,'');return v===''?NaN:Number(v)};
const _df={};
function fdate(d,o){const k=dateLoc()+JSON.stringify(o);return(_df[k]||(_df[k]=new Intl.DateTimeFormat(dateLoc(),o))).format(d)}
const toDate=s=>s?new Date(s):null;
const pad2=n=>String(n).padStart(2,'0');
const localISO=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const dayKey=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fDT=s=>s?fdate(new Date(s),{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const fDay=d=>st().lang==='fa'?fdate(d,{weekday:'long'})+'، '+fdate(d,{day:'numeric',month:'long',year:'numeric'}):fdate(d,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
const symFmt=s=>'<bdi class="n">'+esc(s||'').replace(/(USDT|USDC|BUSD|FDUSD|USD)$/,m=>s===m?m:'<span class="mut">/'+m+'</span>')+'</bdi>';

/* ---------------- Calculations ---------------- */
function calc(x){
  const e=+x.entry||0,ex=+x.exit||0,sl=+x.sl||0,tp=+x.tp||0,fees=+x.fees||0;
  const lev=x.mkt==='fut'?Math.max(1,+x.lev||1):1,dir=x.side==='short'?-1:1;
  const qty=e>0?(x.sizeMode==='qty'?+x.size||0:(+x.size||0)/e):0;
  const notional=qty*e,margin=notional/lev;
  const risk=sl>0&&qty>0&&sl!==e?Math.abs(e-sl)*qty+fees*0:null;
  const rr=sl>0&&tp>0&&e!==sl?Math.abs(tp-e)/Math.abs(e-sl):null;
  let pnl=null,pc=null,R=null;
  if(x.status==='closed'&&ex>0&&qty>0){pnl=(ex-e)*qty*dir-fees;pc=margin>0?pnl/margin*100:null;R=risk?pnl/risk:null}
  return{qty,notional,margin,risk,rr,pnl,pct:pc,R,lev};
}
const tTime=x=>+new Date(x.close||x.open||x.created||0);
const resultOf=x=>{if(x.status!=='closed')return'open';const p=calc(x).pnl;return p==null?'open':p>0?'win':p<0?'loss':'be'};
function analyze(list){
  const cl=list.filter(x=>x.status==='closed').map(x=>({x,c:calc(x)})).filter(o=>o.c.pnl!=null).sort((a,b)=>tTime(a.x)-tTime(b.x));
  const start=+st().startBal||0;let bal=start,peak=start,dd=0,ddp=0,gw=0,gl=0,wins=0,losses=0,sumR=0,nR=0;
  const pts=[];let streak=0,maxW=0,maxL=0,best=null,worst=null;
  for(const o of cl){const p=o.c.pnl;bal+=p;pts.push({t:tTime(o.x),y:bal,p});
    if(bal>peak)peak=bal;const d=peak-bal;if(d>dd){dd=d;ddp=peak>0?d/peak*100:0}
    if(p>0){gw+=p;wins++;streak=streak>0?streak+1:1}else if(p<0){gl+=-p;losses++;streak=streak<0?streak-1:-1}else streak=0;
    maxW=Math.max(maxW,streak);maxL=Math.min(maxL,streak);
    if(o.c.R!=null){sumR+=o.c.R;nR++}
    if(!best||p>best.c.pnl)best=o;if(!worst||p<worst.c.pnl)worst=o}
  const n=cl.length,net=bal-start;
  return{n,cl,start,bal,net,netPct:start>0?net/start*100:null,wins,losses,winRate:n?wins/n*100:null,pf:gl>0?gw/gl:(gw>0?Infinity:null),
    avgR:nR?sumR/nR:null,exp:n?net/n:null,expR:nR?sumR/nR:null,dd,ddp,best,worst,streak,maxW,maxL:-maxL,pts,gw,gl,avgWin:wins?gw/wins:null,avgLoss:losses?gl/losses:null};
}

function drawEquity(el,A){

  if(eqRange!=='all'){const cut=Date.now()-(eqRange==='d30'?30:90)*864e5;const before=pts.filter(p=>p.t<cut);const base=before.length?before[before.length-1].y:A.start;pts=[{t:cut,y:base}].concat(pts.filter(p=>p.t>=cut))}

  const by=Y(A.start);const grid=[hi-padY,(hi+lo)/2,lo+padY].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-dasharray="3 4"/><text class="axis" x="${W-pr-2}" y="${Y(v)-4}" text-anchor="end">${dig(nf(v,0))}</text>`).join('');

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${t('equity')}: ${esc(nf(pts[0].y,2))} → ${esc(nf(pts[pts.length-1].y,2))}. ${t('chartKeys')}">

   ${grid}${by>pt&&by<H-pb?`<line x1="${pl}" x2="${W-pr}" y1="${by}" y2="${by}" stroke="var(--sec)" stroke-opacity=".7" stroke-width="1"/>`:''}
   <path d="${area}" fill="url(#eqg)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
   <text class="axis" x="${pl}" y="${H-6}">${dl(t0)}</text><text class="axis" x="${W-pr}" y="${H-6}" text-anchor="end">${dl(t1)}</text>
   <line id="eqx" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/><circle id="eqd" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
  </svg><div class="tip" id="eqTip"></div>`;
  const svg=el.querySelector('svg'),tip=$('eqTip'),vx=svg.querySelector('#eqx'),dot=svg.querySelector('#eqd');
  let ki=-1;
  const show=b=>{const r=svg.getBoundingClientRect();
    const px=X(b.t),py=Y(b.y);vx.setAttribute('x1',px);vx.setAttribute('x2',px);vx.setAttribute('visibility','visible');dot.setAttribute('cx',px);dot.setAttribute('cy',py);dot.setAttribute('visibility','visible');
    tip.innerHTML=`<span class="mut">${fdate(new Date(b.t),{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><b>${money(b.y,false)}</b>${b.p!=null?`<span class="${cls(b.p)}">${money(b.p)}</span>`:''}`;
    tip.style.left=Math.min(Math.max(px/W*r.width,70),r.width-70)+'px';tip.classList.add('on')};
  const move=e=>{const r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*W;let bi=0;pts.forEach((p,i)=>{if(Math.abs(X(p.t)-mx)<Math.abs(X(pts[bi].t)-mx))bi=i});ki=bi;show(pts[bi])};
  const leave=()=>{tip.classList.remove('on');vx.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',leave);
  svg.addEventListener('keydown',e=>{const k={ArrowLeft:-1,ArrowRight:1,ArrowDown:-1,ArrowUp:1}[e.key];if(e.key==='Home')ki=0;else if(e.key==='End')ki=pts.length-1;else if(k)ki=ki<0?(k>0?0:pts.length-1):Math.min(pts.length-1,Math.max(0,ki+k));else return;e.preventDefault();show(pts[ki])});

const JP=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
function jParts(d){const o={};JP.formatToParts(d).forEach(p=>{if(p.type!=='literal')o[p.type]=parseInt(p.value,10)});return{y:o.year,m:o.month,d:o.day}}
function jFirst(jy,jm){const d=new Date(jy+621,2,21+Math.round((jm-1)*30.5),12);for(let i=0;i<12;i++){const p=jParts(d);const delta=((jy-p.y)*12+(jm-p.m))*30+(1-p.d);if(!delta)break;d.setDate(d.getDate()+delta)}return d}
let cal=null,calSel=null;
function calNow(){const n=new Date();if(st().lang==='fa'){const p=jParts(n);return{y:p.y,m:p.m,sys:'fa'}}return{y:n.getFullYear(),m:n.getMonth()+1,sys:'en'}}
function monthDays(){if(cal.sys==='fa'){const s=jFirst(cal.y,cal.m),out=[];const d=new Date(s);while(jParts(d).m===cal.m&&out.length<32){out.push(new Date(d));d.setDate(d.getDate()+1)}return out}
  const n=new Date(cal.y,cal.m,0).getDate();return Array.from({length:n},(_,i)=>new Date(cal.y,cal.m-1,i+1,12))}
function dailyPnl(){const m={};for(const x of S.trades){if(x.status!=='closed')continue;const c=calc(x);if(c.pnl==null)continue;const k=dayKey(new Date(x.close||x.open));(m[k]||(m[k]={p:0,n:0,ids:[]})).p+=c.pnl;m[k].n++;m[k].ids.push(x.id)}return m}

  if(!cal||cal.sys!==(st().lang==='fa'?'fa':'en'))cal=calNow();

  const wkStart=fa?6:0;const order=Array.from({length:7},(_,i)=>(wkStart+i)%7);
  const lead=(days[0].getDay()-wkStart+7)%7;
  const vals=days.map(d=>dp[dayKey(d)]).filter(Boolean),mx=Math.max(1,...vals.map(v=>Math.abs(v.p)));
  const tot=vals.reduce((s,v)=>s+v.p,0),gd=vals.filter(v=>v.p>0).length,rd=vals.filter(v=>v.p<0).length;
  const title=fdate(days[0],{year:'numeric',month:'long'});const today=dayKey(new Date());
  const compact=v=>{const a=Math.abs(v);return(v>0?'+':v<0?'−':'')+(a>=1000?nf(a/1000,0,1)+'k':nf(a,0))};

  let side='';if(calSel&&dp[calSel]){const ids=dp[calSel].ids;side=`<div class="card"><h2>${t('dayTrades')}<small>${fDay(new Date(calSel+'T12:00'))}</small></h2>${S.trades.filter(x=>ids.includes(x.id)).map(tradeRow).join('')}</div>`}

   <div class="cal">${cells}</div>

function demoTrades(){let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P={BTCUSDT:67000,ETHUSDT:3400,SOLUSDT:165,BNBUSDT:590,XRPUSDT:.62,DOGEUSDT:.15};const syms=Object.keys(P);
  const tfs=['15m','1h','4h','1h','5m','1D'],eb=['calm','focused','confident','fomo','fear','greed','neutral','revenge'],ea=['happy','calm','neutral','regret','frustrated'];
  const out=[],now=Date.now();
  for(let i=0;i<24;i++){const sym=syms[Math.floor(rnd()*syms.length)],p0=P[sym]*(0.92+rnd()*0.16),side=rnd()<.6?'long':'short',dir=side==='long'?1:-1;
    const fut=rnd()<.7,lev=fut?[3,5,10,10,20][Math.floor(rnd()*5)]:1;const riskPct=0.006+rnd()*0.018;const sl=p0*(1-dir*riskPct);const rr=1.5+rnd()*1.8;const tp=p0*(1+dir*riskPct*rr);
    const win=rnd()<.6;const outR=win?(0.5+rnd()*(rr-0.4)):-(0.45+rnd()*0.55);const ex=p0*(1+dir*riskPct*outR);
    const sizeU=Math.round((150+rnd()*850)/10)*10*(fut?lev/5:1);const dayOff=44-Math.floor(i*44/24)-Math.floor(rnd()*2);
    const od=new Date(now-dayOff*864e5);od.setHours(8+Math.floor(rnd()*14),Math.floor(rnd()*4)*15,0,0);const cd=new Date(+od+(0.5+rnd()*20)*36e5);
    const isOpen=i>=22;const dec=p0>=100?2:p0>=1?3:5;const r=v=>+v.toFixed(dec);
    out.push({id:'demo_'+i,demo:true,sym,mkt:fut?'fut':'spot',side,lev,entry:r(p0),exit:isOpen?'':r(ex),sizeMode:'usdt',size:Math.round(sizeU),sl:r(sl),tp:r(tp),fees:+(sizeU*0.0008).toFixed(2),
      open:localISO(od),close:isOpen?'':localISO(cd>new Date()?new Date():cd),status:isOpen?'open':'closed',setup:S.setups[Math.floor(rnd()*Math.min(5,S.setups.length))]||'',tf:tfs[Math.floor(rnd()*tfs.length)],
      emoB:eb[Math.floor(rnd()*eb.length)],emoA:isOpen?'':ea[win?Math.floor(rnd()*3):3+Math.floor(rnd()*2)],rule:rnd()<.75,rating:1+Math.floor(rnd()*5),notes:'',shots:[],created:+od})}
  return out}

let lkMode='',lkBuf='',lkFirst='';
async function H(x){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tj:'+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){return'p'+btoa(x)}}
function lkUI(msg){if(msg!=null)$('lockT').textContent=msg;$('lockDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<lkBuf.length?'on':''}"></i>`).join('')}
function lkShow(m){lkMode=m;lkBuf='';lkFirst='';$('lock').classList.add('on');$('lockCancel').hidden=m==='unlock';$('lockCancel').textContent=t('cancel');lkUI(t({unlock:'pinEnter',set1:'pinNew',off:'pinOffEnter'}[m]))}
function lkClose(){$('lock').classList.remove('on');document.documentElement.classList.remove('lkd');if(view==='settings')render()}
$('lockPad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}" aria-label="${k==='⌫'?'Backspace':k}">${k}</button>`).join('');
async function lkKey(k){if(k==='⌫')lkBuf=lkBuf.slice(0,-1);else if(/\d/.test(k)&&lkBuf.length<4)lkBuf+=k;lkUI();if(lkBuf.length<4)return;
  const fail=m=>{lkBuf='';lkUI(m);const d=$('lockDots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')};
  if(lkMode==='set1'){lkFirst=lkBuf;lkBuf='';lkMode='set2';return lkUI(t('pinAgain'))}
  if(lkMode==='set2'){if(lkBuf===lkFirst){localStorage.setItem(LK,await H(lkBuf));lkClose();return toast(t('pinSet'))}lkMode='set1';return fail(t('pinMismatch'))}
  if(await H(lkBuf)===localStorage.getItem(LK)){if(lkMode==='off'){localStorage.removeItem(LK);toast(t('pinRemoved'))}lkClose()}else fail(t('pinWrong'))}
$('lockPad').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)lkKey(b.dataset.k)});
document.addEventListener('keydown',e=>{if(!$('lock').classList.contains('on'))return;if(/^\d$/.test(e.key))lkKey(e.key);else if(e.key==='Backspace')lkKey('⌫');else if(e.key==='Escape'&&lkMode!=='unlock')lkClose()});
$('lockCancel').onclick=lkClose;
let lastHide=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)lastHide=Date.now();else if(localStorage.getItem(LK)&&Date.now()-lastHide>60000)lkShow('unlock')});

  const sg=e.target.closest('[data-seg] button');if(sg&&FT){const name=sg.parentElement.dataset.seg;FT[name]=sg.dataset.v;sg.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===sg));
    if(name==='mkt')$('levBox').hidden=FT.mkt==='spot';if(name==='status'){$('closeBox').hidden=$('exitWrap').hidden=FT.status==='open';if(FT.status==='closed'&&!$('f_close').value){const n=new Date();n.setSeconds(0,0);$('f_close').value=localISO(n);updDateHints()}}updCalc();return}
  const cp=e.target.closest('[data-chips] .chip');if(cp&&FT){const name=cp.parentElement.dataset.chips;FT[name]=FT[name]===cp.dataset.v?'':cp.dataset.v;cp.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',FT[name]===b.dataset.v));return}
  if(!a)return;const act=a.dataset.act,v=a.dataset.v;
  switch(act){
    case'add':openForm();break;
    case'edit':if(e.target.closest('.del'))return;openForm(a.dataset.id);break;
    case'del':e.stopPropagation();delTrade(a.dataset.id);break;
    case'delFromForm':{const id=FT&&FT.id;if(id&&await delTrade(id))closeForm();break}
    case'closeForm':closeForm();break;
    case'pickSym':$('f_sym').value=v;$('e_sym').textContent='';break;
    case'star':FT.rating=FT.rating===+v?0:+v;rStars();break;
    case'addShot':$('fileShot').click();break;
    case'rmShot':{const s=FShots.splice(+a.dataset.i,1)[0];if(s&&s.k)FRemoved.push(s.k);rShots();break}
    case'viewShot':{const s=FShots[+a.dataset.i];if(s){$('viewer').querySelector('img').src=s.v;$('viewer').classList.add('on')}break}
    case'closeViewer':$('viewer').classList.remove('on');break;
    case'addSetupF':{const i=$('f_newSetup'),n=i.value.trim();if(!n)return;if(!S.setups.includes(n)){S.setups.push(n);save()}FT.setup=n;i.value='';
      $('setupBox').innerHTML=S.setups.map(s=>`<button type="button" class="chip" data-v="${esc(s)}" aria-pressed="${FT.setup===s}">${esc(s)}</button>`).join('');break}
    case'addSetupS':{const i=$('newSetup'),n=i.value.trim();if(n&&!S.setups.includes(n)){S.setups.push(n);save()}render();break}
    case'rmSetup':S.setups.splice(+a.dataset.i,1);save();render();break;
    case'eq':eqRange=v;render();break;
    case'toggleF':fOpen=!fOpen;rTrades();break;
    case'clearF':Object.assign(F,{pair:'',setup:'',side:'',res:'',from:'',to:''});rTrades();break;
    case'calMove':{let m=cal.m+ +v,y=cal.y;if(m<1){m=12;y--}if(m>12){m=1;y++}cal={...cal,y,m};calSel=null;rCal();break}
    case'calDay':calSel=calSel===a.dataset.k?null:a.dataset.k;rCal();break;
    case'lang':st().lang=v;if(!S.trades.length&&JSON.stringify(S.setups)===JSON.stringify(DEF_SETUPS[v==='fa'?'en':'fa']))S.setups=DEF_SETUPS[v].slice();save();applyLang();cal=null;render();break;
    case'theme':st().theme=v;save();applyTheme();render();break;
    case'accent':st().accent=v;save();applyTheme();render();break;
    case'exportJson':exportJson();break;
    case'importJson':$('fileImport').click();break;
    case'exportCsv':exportCsv();break;
    case'demo':loadDemo();break;
    case'rmDemo':rmDemo();break;
    case'wipe':wipe();break;
    case'pinSet':lkShow('set1');break;
    case'pinOff':lkShow('off');break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.trade[role=button]')){e.preventDefault();openForm(e.target.dataset.id)}
  if(e.key==='Escape'){if($('viewer').classList.contains('on'))$('viewer').classList.remove('on');else if(FT&&!$('modal').classList.contains('on'))closeForm()}});
$('ovl').onclick=closeForm;
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))$('viewer').classList.remove('on')});
$('sheet').addEventListener('submit',submitForm);
$('sheet').addEventListener('input',e=>{if(e.target.matches('.inp')){updCalc();if(e.target.type==='datetime-local')updDateHints();if(e.target.id&&$('e_'+e.target.id.slice(2)))$('e_'+e.target.id.slice(2)).textContent=''}});
$('fileShot').addEventListener('change',async e=>{for(const f of e.target.files){try{FShots.push({k:null,v:await compressImage(f)})}catch(err){console.error(err)}}e.target.value='';rShots()});
$('fileImport').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importJson(f)});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){F.q=e.target.value;rList()}
  if(e.target.id==='sBal'){const n=parseNum(e.target.value);if(isFinite(n)&&n>=0){st().startBal=n;save()}}
});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){F[f]=e.target.value;rTrades()}if(e.target.id==='sDig'){st().digits=e.target.checked?'fa':'latn';save();render()}});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(view==='dash')render()},150)});
window.addEventListener('hashchange',()=>go(location.hash.replace('#/',''),false));

/* ---------------- Boot ---------------- */
applyTheme();applyLang();
go((location.hash||'').replace('#/','')||'dash',false);
if(localStorage.getItem(LK))lkShow('unlock');else document.documentElement.classList.remove('lkd');
if(new URLSearchParams(location.search).has('add')&&!localStorage.getItem(LK))openForm();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
window.TJ={get state(){return S},calc,analyze,VER};
</script>
